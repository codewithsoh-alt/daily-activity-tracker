<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities — Daily Activity Tracker</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="badge bg-primary rounded-pill p-2">📅</span>
        <span>Daily Activity Tracker</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="activities.html">Activities</a></li>
          <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar</a></li>
          <li class="nav-item"><a class="nav-link" href="statistics.html">Statistics</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-4 flex-grow-1">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1">Manage Activities</h2>
        <p class="text-muted mb-0">Search, filter, edit, or create new activities.</p>
      </div>
      <div>
        <button class="btn btn-primary d-inline-flex align-items-center gap-2 shadow-sm" onclick="openCreateModal()">
          <span>+ New Activity</span>
        </button>
      </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="search-input" class="form-control" placeholder="Search by title or description...">
          </div>
          <div class="col-sm-6 col-md-2">
            <select id="filter-status" class="form-select">
              <option value="">All Statuses</option>
              <option value="PENDING">Pending</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>
          <div class="col-sm-6 col-md-2">
            <select id="filter-priority" class="form-select">
              <option value="">All Priorities</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
          <div class="col-sm-6 col-md-2">
            <select id="filter-category" class="form-select">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="col-sm-6 col-md-2">
            <input type="date" id="filter-date" class="form-control">
          </div>
        </div>
      </div>
    </div>

    <!-- Activities List -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-3">
        <div id="activities-list" class="vstack gap-3">
          <div class="text-center py-5 text-muted">Loading activities...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Activity Add / Edit Modal -->
  <div class="modal fade" id="activityModal" tabindex="-1" aria-labelledby="activityModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="activityForm" onsubmit="saveActivity(event)">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="activityModalLabel">Add Activity</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body vstack gap-3">
            <input type="hidden" id="activity-id">
            
            <div>
              <label for="form-title" class="form-label fw-semibold">Title *</label>
              <input type="text" class="form-control" id="form-title" required maxlength="150" placeholder="e.g., Complete Chapter 3 Assignment">
            </div>

            <div>
              <label for="form-desc" class="form-label">Description</label>
              <textarea class="form-control" id="form-desc" rows="2" placeholder="Optional details..."></textarea>
            </div>

            <div class="row g-2">
              <div class="col-sm-4">
                <label for="form-date" class="form-label fw-semibold">Date *</label>
                <input type="date" class="form-control" id="form-date" required>
              </div>
              <div class="col-sm-4">
                <label for="form-start-time" class="form-label">Start Time</label>
                <input type="time" class="form-control" id="form-start-time">
              </div>
              <div class="col-sm-4">
                <label for="form-end-time" class="form-label">End Time</label>
                <input type="time" class="form-control" id="form-end-time">
              </div>
            </div>

            <div class="row g-2">
              <div class="col-sm-6">
                <label for="form-priority" class="form-label fw-semibold">Priority</label>
                <select class="form-select" id="form-priority">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label for="form-category" class="form-label">Category</label>
                <select class="form-select" id="form-category">
                  <option value="">None / Unassigned</option>
                </select>
              </div>
            </div>

            <div>
              <label for="form-notes" class="form-label">Notes</label>
              <textarea class="form-control" id="form-notes" rows="2" placeholder="Reference links or reminders..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveActivityBtn">Save Activity</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-white border-top py-3 text-center text-muted small">
    Daily Activity Tracker &bull; Local & Offline Ready
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/activities.js"></script>
</body>
</html>
